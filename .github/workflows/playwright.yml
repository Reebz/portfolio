name: playwright

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright tests
        run: npm test
      # TEMPORARY: regenerate the Linux screenshot baselines and upload them so
      # they can be committed (no local Docker to produce -linux.png). Remove
      # this step once the Linux baselines are committed.
      - name: Regenerate Linux screenshot baselines
        if: always()
        run: npx playwright test mobile-screenshots --update-snapshots --project=iphone-14
      - name: Upload regenerated Linux baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot-baselines
          path: tests/mobile-screenshots.spec.js-snapshots/*-linux.png
          retention-days: 14
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
